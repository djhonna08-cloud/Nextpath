<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="730" viewBox="0 0 1320 730" role="img" aria-labelledby="title desc">
  <title id="title">More NextPath logo concepts</title>
  <desc id="desc">Four further logo directions: an open book forming an arrow, a path checkmark, converging routes, and an N made from stepping stones.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#315efb"/><stop offset="1" stop-color="#7543ed"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#6948e8"/><stop offset="1" stop-color="#a344e8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172b55" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1320" height="730" rx="28" fill="#f4f6fc"/>
  <text x="660" y="60" text-anchor="middle" fill="#14264c" font-family="Arial,sans-serif" font-size="30" font-weight="700">More NextPath logo ideas</text>
  <text x="660" y="92" text-anchor="middle" fill="#647594" font-family="Arial,sans-serif" font-size="16">Learning, choices, and the way forward</text>

  <g filter="url(#shadow)">
    <rect x="34" y="126" width="300" height="550" rx="20" fill="#fff"/>
    <rect x="354" y="126" width="300" height="550" rx="20" fill="#fff"/>
    <rect x="674" y="126" width="300" height="550" rx="20" fill="#fff"/>
    <rect x="994" y="126" width="292" height="550" rx="20" fill="#fff"/>
  </g>

  <!-- 04: Open book becomes a forward arrow -->
  <g transform="translate(116 220)" fill="none" stroke="url(#brand)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 25c27-8 49-2 66 15 17-17 39-23 66-15v78c-27-7-49-1-66 16-17-17-39-23-66-16z" stroke-width="8"/>
    <path d="M78 40v68M45 53c10 1 19 5 27 11M111 53c-9 1-17 4-24 9" stroke-width="5"/>
    <path d="M78 138h42m-14-14 14 14-14 14" stroke-width="8"/>
  </g>
  <text x="184" y="425" text-anchor="middle" fill="#14264c" font-family="Arial,sans-serif" font-size="25" font-weight="700">NextPath</text>
  <text x="184" y="477" text-anchor="middle" fill="#315efb" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">04 · BOOK TO ARROW</text>
  <text x="184" y="518" text-anchor="middle" fill="#647594" font-family="Arial,sans-serif" font-size="14">Learning that leads</text>
  <text x="184" y="541" text-anchor="middle" fill="#647594" font-family="Arial,sans-serif" font-size="14">to your next step.</text>

  <!-- 05: A winding path becomes a check -->
  <g transform="translate(434 220)" fill="none" stroke="url(#brand)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 99c0-20 12-33 29-33h15c14 0 23-7 23-18 0-9 8-16 19-16h29"/>
    <path d="m105 18 18 14-18 14" stroke-width="9"/>
    <path d="m45 100 20 20 51-57" stroke-width="12"/>
  </g>
  <text x="504" y="425" text-anchor="middle" fill="#14264c" font-family="Arial,sans-serif" font-size="25" font-weight="700">NextPath</text>
  <text x="504" y="477" text-anchor="middle" fill="#6848d9" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">05 · PATH CHECK</text>
  <text x="504" y="518" text-anchor="middle" fill="#647594" font-family="Arial,sans-serif" font-size="14">A confident choice</text>
  <text x="504" y="541" text-anchor="middle" fill="#647594" font-family="Arial,sans-serif" font-size="14">that feels right.</text>

  <!-- 06: Many directions meet at one point -->
  <g transform="translate(752 220)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 29c28 0 38 17 51 52 13-35 23-52 51-52" stroke="#315efb" stroke-width="10"/>
    <path d="M22 74h51m0 0h51" stroke="#7543ed" stroke-width="10"/>
    <path d="M22 119c28 0 38-17 51-52 13 35 23 52 51 52" stroke="#a344e8" stroke-width="10"/>
    <circle cx="73" cy="74" r="10" fill="#fff" stroke="url(#brand)" stroke-width="7"/>
    <path d="M124 29h16V13M124 119h16v16" stroke="#6848d9" stroke-width="7"/>
  </g>
  <text x="824" y="425" text-anchor="middle" fill="#14264c" font-family="Arial,sans-serif" font-size="25" font-weight="700">NextPath</text>
  <text x="824" y="477" text-anchor="middle" fill="#8b42d8" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">06 · MANY ROUTES</text>
  <text x="824" y="518" text-anchor="middle" fill="#647594" font-family="Arial,sans-serif" font-size="14">Many interests, one</text>
  <text x="824" y="541" text-anchor="middle" fill="#647594" font-family="Arial,sans-serif" font-size="14">personal direction.</text>

  <!-- 07: N built from stepping stones -->
  <g transform="translate(1066 220)">
    <rect x="10" y="91" width="30" height="30" rx="9" fill="#315efb"/>
    <rect x="10" y="49" width="30" height="30" rx="9" fill="#4a5df4"/>
    <rect x="10" y="7" width="30" height="30" rx="9" fill="#6255ef"/>
    <rect x="52" y="49" width="30" height="30" rx="9" fill="#7543ed"/>
    <rect x="94" y="91" width="30" height="30" rx="9" fill="#8343eb"/>
    <rect x="94" y="49" width="30" height="30" rx="9" fill="#9844e8"/>
    <rect x="94" y="7" width="30" height="30" rx="9" fill="#a344e8"/>
  </g>
  <text x="1130" y="425" text-anchor="middle" fill="#14264c" font-family="Arial,sans-serif" font-size="25" font-weight="700">NextPath</text>
  <text x="1130" y="477" text-anchor="middle" fill="#a344e8" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">07 · STEPPING N</text>
  <text x="1130" y="518" text-anchor="middle" fill="#647594" font-family="Arial,sans-serif" font-size="14">Small steps toward</text>
  <text x="1130" y="541" text-anchor="middle" fill="#647594" font-family="Arial,sans-serif" font-size="14">a bigger future.</text>
</svg>
