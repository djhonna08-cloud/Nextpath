<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">NextPath logo concepts</title>
  <desc id="desc">Three clean logo concepts in indigo and violet: a path shaped like N, a compass with N, and two paths meeting at an arrow.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#315efb"/><stop offset="1" stop-color="#7543ed"/></linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#315efb"/><stop offset="1" stop-color="#a344e8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172b55" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#f4f6fc"/>
  <text x="600" y="62" text-anchor="middle" fill="#14264c" font-family="Arial,sans-serif" font-size="30" font-weight="700">NextPath logo concepts</text>
  <text x="600" y="94" text-anchor="middle" fill="#647594" font-family="Arial,sans-serif" font-size="16">Three directions, one indigo-violet palette</text>

  <g filter="url(#shadow)">
    <rect x="48" y="128" width="348" height="510" rx="20" fill="#fff"/>
    <rect x="426" y="128" width="348" height="510" rx="20" fill="#fff"/>
    <rect x="804" y="128" width="348" height="510" rx="20" fill="#fff"/>
  </g>

  <!-- 01: Route shaped like an N -->
  <g transform="translate(148 220)">
    <rect width="148" height="148" rx="34" fill="url(#brand)"/>
    <path d="M40 108V40l68 68V40l20-20" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M110 20h18v18" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="222" y="425" text-anchor="middle" fill="#14264c" font-family="Arial,sans-serif" font-size="27" font-weight="700">NextPath</text>
  <text x="222" y="477" text-anchor="middle" fill="#315efb" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">01 · PATH N</text>
  <text x="222" y="514" text-anchor="middle" fill="#647594" font-family="Arial,sans-serif" font-size="15">A clear route toward</text>
  <text x="222" y="537" text-anchor="middle" fill="#647594" font-family="Arial,sans-serif" font-size="15">what comes next.</text>

  <!-- 02: Compass with an N -->
  <g transform="translate(526 220)">
    <circle cx="74" cy="74" r="69" fill="#f4f2ff" stroke="url(#brand)" stroke-width="7"/>
    <path d="M74 20l13 42-13 66-13-66z" fill="url(#brand)"/>
    <circle cx="74" cy="74" r="8" fill="#fff"/>
    <path d="M74 7v12M141 74h-12M74 141v-12M7 74h12" stroke="#8992bd" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="600" y="425" text-anchor="middle" fill="#14264c" font-family="Arial,sans-serif" font-size="27" font-weight="700">NextPath</text>
  <text x="600" y="477" text-anchor="middle" fill="#6848d9" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">02 · FIND YOUR BEARING</text>
  <text x="600" y="514" text-anchor="middle" fill="#647594" font-family="Arial,sans-serif" font-size="15">A compass for choosing</text>
  <text x="600" y="537" text-anchor="middle" fill="#647594" font-family="Arial,sans-serif" font-size="15">your direction.</text>

  <!-- 03: Two routes joining -->
  <g transform="translate(904 220)">
    <rect width="148" height="148" rx="34" fill="#f1efff"/>
    <path d="M34 108c0-31 20-49 48-49h28V31" fill="none" stroke="#315efb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 40c0 31 20 49 48 49h28v19" fill="none" stroke="#9a4de4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M93 31h17V14M93 107h17v17" fill="none" stroke="#7543ed" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="34" cy="40" r="7" fill="#315efb"/><circle cx="34" cy="108" r="7" fill="#9a4de4"/>
  </g>
  <text x="978" y="425" text-anchor="middle" fill="#14264c" font-family="Arial,sans-serif" font-size="27" font-weight="700">NextPath</text>
  <text x="978" y="477" text-anchor="middle" fill="#8b42d8" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">03 · PATHS COME TOGETHER</text>
  <text x="978" y="514" text-anchor="middle" fill="#647594" font-family="Arial,sans-serif" font-size="15">Different interests,</text>
  <text x="978" y="537" text-anchor="middle" fill="#647594" font-family="Arial,sans-serif" font-size="15">a path that fits you.</text>
</svg>
